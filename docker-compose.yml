name: payments-lakehouse

services:
  postgres:
    image: postgres:17.12
    container_name: pl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Read by postgres/init/02_cdc_setup.sh to create the Debezium role.
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?set DEBEZIUM_PASSWORD in .env}
    command:
      - postgres
      # Write enough detail to the WAL for logical decoding (what Debezium reads).
      - -c
      - wal_level=logical
      # Cap the WAL a replication slot can hold back. Without this, a stopped
      # Debezium connector makes Postgres keep WAL forever until the disk fills.
      - -c
      - max_slot_wal_keep_size=2GB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, in filename order, only when pgdata is empty.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # Versioned schema changes; 03_apply_migrations.sh applies them on a fresh volume.
      - ./postgres/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Single-node Kafka in KRaft mode: the same process is broker and controller
  # (no ZooKeeper; Kafka 4 removed it).
  kafka:
    image: confluentinc/cp-kafka:8.4.0
    container_name: pl-kafka
    environment:
      CLUSTER_ID: cLr0JRxUR0ekDYZ12K0Rbg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners for two audiences: other containers connect to
      # kafka:29092, programs on the Mac connect to localhost:9092.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created on purpose (by Connect), never by a typo in a consumer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # One broker, so Kafka's own internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
      start_interval: 3s

  # Stores Avro schemas; messages carry only a 4-byte schema id instead of the schema.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.0
    container_name: pl-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # A new schema version must still be able to read data written with the previous one.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s

  # Kafka Connect worker running the Debezium Postgres source connector.
  # The connector itself is registered with connect/register.sh.
  connect:
    build:
      context: ./connect
      args:
        CP_VERSION: 8.4.0
        DEBEZIUM_VERSION: 3.7.1.Final
    image: payments-lakehouse/connect:8.4.0-debezium-3.7.1
    container_name: pl-connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: payments-connect
      # Connect keeps all of its state in Kafka: connector configs, source
      # offsets (for Debezium: the last WAL position sent) and task status.
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # How often source offsets are committed (default 60 s). Debezium only
      # confirms a WAL position to Postgres after the offset is committed, so
      # this also controls how quickly the replication slot can release WAL.
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      # Lets connector configs say ${env:DEBEZIUM_PASSWORD} instead of the real
      # password, so the connector JSON in git holds no secret.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?set DEBEZIUM_PASSWORD in .env}
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/connectors', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 3s

  # Web UI for browsing topics, Avro-decoded messages, schemas and connectors.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: pl-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: payments
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: payments-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xmx384m
    ports:
      - "8080:8080"

  # S3-compatible object storage for the lakehouse files (local stand-in for
  # AWS S3). RustFS, because MinIO no longer publishes container images; any
  # S3-compatible store works, since Iceberg only talks the S3 API.
  object-store:
    image: rustfs/rustfs:1.0.5
    container_name: pl-object-store
    environment:
      RUSTFS_ACCESS_KEY: ${LAKEHOUSE_S3_ACCESS_KEY:?set LAKEHOUSE_S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${LAKEHOUSE_S3_SECRET_KEY:?set LAKEHOUSE_S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # One-off: create the lakehouse bucket if it doesn't exist yet, then exit.
  object-store-init:
    image: amazon/aws-cli:2.39.6
    container_name: pl-object-store-init
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://object-store:9000 s3api head-bucket --bucket lakehouse 2>/dev/null
        || aws --endpoint-url http://object-store:9000 s3api create-bucket --bucket lakehouse

  # Iceberg catalog: maps each table name to its current metadata file and
  # makes commits atomic. Separate from the source database on purpose: the
  # payments database belongs to the application, not to the lakehouse.
  iceberg-catalog:
    image: postgres:17.12
    container_name: pl-iceberg-catalog
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: ${ICEBERG_CATALOG_PASSWORD:?set ICEBERG_CATALOG_PASSWORD in .env}
      POSTGRES_DB: iceberg
    volumes:
      - catalogdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Streaming job: Kafka CDC topics -> Iceberg bronze tables (spark/jobs/bronze_cdc.py).
  spark-bronze:
    build:
      context: ./spark
      args:
        SPARK_VERSION: 4.1.4
        ICEBERG_VERSION: 1.12.0
    image: payments-lakehouse/spark:4.1.4-iceberg-1.12.0
    container_name: pl-spark-bronze
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      iceberg-catalog:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    command: ["/opt/spark/bin/spark-submit", "/opt/lakehouse/jobs/bronze_cdc.py", "--trigger-seconds", "30"]
    environment:
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_S3_SECRET_KEY}
      AWS_REGION: us-east-1
      ICEBERG_CATALOG_PASSWORD: ${ICEBERG_CATALOG_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./spark/jobs:/opt/lakehouse/jobs:ro
      # Kafka offsets + Iceberg commit ids per micro-batch. Losing this means
      # re-reading Kafka from the start (production keeps it on S3).
      - sparkcheckpoints:/checkpoints
    ports:
      - "4040:4040"   # Spark UI while the job runs
    # A failed query stops the job; Docker restarts it and every query resumes
    # from its checkpoint. This is also how it picks up a new schema version.
    restart: unless-stopped

  # Streaming job: bronze change events -> silver current state (spark/jobs/silver_cdc.py).
  spark-silver:
    image: payments-lakehouse/spark:4.1.4-iceberg-1.12.0
    container_name: pl-spark-silver
    depends_on:
      iceberg-catalog:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
      spark-bronze:
        condition: service_started
    command: ["/opt/spark/bin/spark-submit", "--conf", "spark.ui.port=4041",
              "/opt/lakehouse/jobs/silver_cdc.py", "--trigger-seconds", "60"]
    environment:
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_S3_SECRET_KEY}
      AWS_REGION: us-east-1
      ICEBERG_CATALOG_PASSWORD: ${ICEBERG_CATALOG_PASSWORD}
      PII_HASH_KEY: ${PII_HASH_KEY:?set PII_HASH_KEY in .env}
    volumes:
      - ./spark/jobs:/opt/lakehouse/jobs:ro
      - sparkcheckpoints:/checkpoints
    ports:
      - "4041:4041"   # Spark UI for the silver job
    restart: unless-stopped

  # On-demand Spark for SQL and checks; never started by `docker compose up`.
  #   ./spark/sql.sh                     (SQL shell)
  #   docker compose run --rm spark-tools /opt/spark/bin/spark-submit \
  #     --py-files /opt/lakehouse/jobs/silver_cdc.py /opt/lakehouse/jobs/reconcile_silver.py
  spark-tools:
    image: payments-lakehouse/spark:4.1.4-iceberg-1.12.0
    profiles: ["tools"]
    environment:
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_S3_SECRET_KEY}
      AWS_REGION: us-east-1
      ICEBERG_CATALOG_PASSWORD: ${ICEBERG_CATALOG_PASSWORD}
      PII_HASH_KEY: ${PII_HASH_KEY}
      # Read-only Postgres access for reconciliation (the CDC role: SELECT only).
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./spark/jobs:/opt/lakehouse/jobs:ro
      - sparkcheckpoints:/checkpoints

  # ---------------------------------------------------------------- orchestration

  # Airflow's own metadata: DAG runs, task states, logs index.
  airflow-db:
    image: postgres:17.12
    container_name: pl-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflowdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Airflow starts job containers through this proxy instead of holding the raw
  # Docker socket. It only allows container and image calls. (Anything that can
  # start containers is still powerful; this narrows it, it doesn't make it safe.)
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: pl-docker-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1  # allow create/start/remove, not only reads
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # `airflow standalone` runs the API server/UI, scheduler, DAG processor and
  # triggerer in one container with the LocalExecutor: right for a laptop.
  # Production splits these (Phase 2: Amazon MWAA).
  airflow:
    image: apache/airflow:3.3.2-python3.12
    container_name: pl-airflow
    command: standalone
    depends_on:
      airflow-db:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
      # Local only: everyone who can reach the UI is an admin, no login page.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      # Read by the DAG file to start job containers.
      DOCKER_HOST: tcp://docker-proxy:2375
      LAKEHOUSE_NETWORK: payments-lakehouse_default
      LAKEHOUSE_HOST_DIR: ${PWD:?run docker compose from the project directory}
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_S3_SECRET_KEY}
      ICEBERG_CATALOG_PASSWORD: ${ICEBERG_CATALOG_PASSWORD}
      PII_HASH_KEY: ${PII_HASH_KEY}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    ports:
      - "8088:8080"   # Airflow UI (8080 is Kafka UI)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s

volumes:
  pgdata:
  kafkadata:
  objectdata:
  catalogdata:
  sparkcheckpoints:
  airflowdb:
