# Applies to every spark-submit, spark-sql and pyspark session in the image.
# Secrets are not here: S3 keys come from AWS_* environment variables (the AWS
# SDK reads them), and the catalog password is passed by the job or sql.sh.

spark.master                        local[*]
spark.driver.memory                 2g
spark.jars                          /opt/lakehouse/jars/*.jar
spark.sql.session.timeZone          UTC
# 200 shuffle partitions is sized for clusters; a laptop wants a handful.
spark.sql.shuffle.partitions        8
spark.ui.showConsoleProgress        false
spark.log.level                     WARN

# Iceberg: SQL extensions add MERGE INTO, ALTER TABLE ... WRITE ORDERED BY, CALL procedures.
spark.sql.extensions                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog            lakehouse

# Catalog "lakehouse": table metadata pointers in Postgres (JDBC catalog),
# data and metadata files in the S3-compatible object store.
spark.sql.catalog.lakehouse                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                    jdbc
spark.sql.catalog.lakehouse.uri                     jdbc:postgresql://iceberg-catalog:5432/iceberg
spark.sql.catalog.lakehouse.jdbc.user               iceberg
spark.sql.catalog.lakehouse.jdbc.schema-version     V1
spark.sql.catalog.lakehouse.warehouse               s3://lakehouse/warehouse
spark.sql.catalog.lakehouse.io-impl                 org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint             http://object-store:9000
spark.sql.catalog.lakehouse.s3.path-style-access    true
spark.sql.catalog.lakehouse.client.region           us-east-1
